[build-system]
# hatchling is a PEP 517 backend that needs no package-discovery configuration
# for a src layout and has no setup.py path at all, so there is one way to build
# this project rather than two. It is a build-time requirement only and is not a
# runtime dependency of the harness core, which decision record 0002 limits to
# NumPy, SciPy and a JSON Schema validator.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eichstelle"
# Placeholder. What a version number promises, and the scheme that produces one,
# is issue #65. Nothing may read meaning into this value until that lands.
version = "0.0.0"
description = "A conformance test suite for acoustics standards with several implementations"
readme = "README.md"

# The interpreter floor is 3.11. Decision record 0002 gives the reasons: 3.10
# leaves CPython security support inside this project's first release horizon,
# 3.11 is the first version carrying tomllib in the standard library so the
# harness reads its own configuration with no dependency, and the current NumPy
# line has already moved its own floor there. It is not the version the author
# had installed.
#
# The ceiling is below 3.15. The scientific wheels this project will depend on
# lag a new CPython release by months, and an unbounded upper bound turns that
# lag into a broken install for whoever upgrades first. The ceiling moves
# deliberately, once those wheels exist and the suite has been run against the
# new interpreter, and not before.
requires-python = ">=3.11,<3.15"

# Empty on purpose. Decision record 0002 permits the harness core to depend on
# NumPy, SciPy and a JSON Schema validator and on nothing else, and none of them
# is needed yet because nothing here generates a signal or reads a fixture.
#
# When NumPy arrives it is pinned exactly rather than bounded, and it is the one
# entry here where that is not a supply-chain precaution. The bytes NumPy
# produces are what a reference signal is, and milestone 3 checksums those bytes
# and stops a run when they move. A floating NumPy is therefore a floating
# reference signal, and the run it breaks reports an implementation
# disagreement, which is a week of somebody's life looking in the wrong place.
# Issue #16 holds that pin open until there is a version to write.
dependencies = []

# There is no license declaration here, and its absence is deliberate rather
# than an omission. The license of this repository is a maintainer decision and
# is open as issue #1. Until it is answered this repository is all rights
# reserved, which is what GitHub already reports, and writing a license field
# here would take a decision that is not this file's to take.

classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

[project.urls]
Homepage = "https://github.com/iderex/eichstelle"
Issues = "https://github.com/iderex/eichstelle/issues"

[project.scripts]
# One console entry point. What it does for an operator is issue #43; here it
# exists, prints the version and exits zero, so that the packaging is proven by
# something that runs rather than by something that imports.
eichstelle = "eichstelle.cli:main"

[dependency-groups]
# Development tools, declared separately from the runtime dependencies above so
# that an operator installing this suite does not install them. Decision record
# 0002 requires that separation. Lower bounds only here; pinning them exactly is
# issue #16.
dev = [
  "ruff>=0.14",
  "mypy>=1.14",
  # The test runner. Its configuration is in [tool.pytest.ini_options] below
  # rather than in a pytest.ini or a tox.ini, so there is one file a contributor
  # opens. The floor is 8.0 because `--strict-config` and the return-not-None
  # warning that the configuration below promotes to an error are both older
  # than that, and pinning it exactly is issue #16 along with everything else
  # here.
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
# Stated rather than inferred: the wheel carries exactly this package from
# exactly this directory. An inferred layout is the thing that quietly stops
# being what anyone expected once a second top-level directory appears.
packages = ["src/eichstelle"]

# ---------------------------------------------------------------------------
# The linter and the formatter (ruff)
# ---------------------------------------------------------------------------

[tool.ruff]
# The floor from requires-python. A linter targeting a newer version than the
# project supports will suggest syntax that does not run on the floor.
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# The rule selection is written down here rather than inherited from whatever
# ruff's default happens to be in the release a contributor installed. A default
# that moves between releases is a gate whose meaning moves with it, and nobody
# reviews a change they did not make.
#
# The principle for what is on: a rule is here if it catches a defect class, and
# it is not here if it enforces a formatting preference. Formatting is the
# formatter's job below, so that no contributor ever argues with a linter about
# a comma.
select = [
  # pycodestyle errors that are not whitespace. E1, E2 and E3 are formatting and
  # are deliberately absent; the formatter decides those and does not negotiate.
  "E4", # bad import placement and shadowing
  "E7", # comparisons to None and True, bare statements that do nothing
  "E9", # syntax and IO errors, which cannot be a preference
  # Pyflakes: undefined names, unused imports, unused locals, f-strings with no
  # placeholder. The classic "it ran until that branch was taken" defects.
  "F",
  # Bugbear: mutable default arguments, loop-variable capture in closures,
  # except-clause ordering. Every entry is a bug someone has shipped.
  "B",
  # Bandit: subprocess without a shell argument stated, hardcoded temporary
  # paths, assert used where a check is meant. This project invokes third-party
  # executables by design, so the subprocess rules earn their place.
  "S",
  # Builtin shadowing. A local named `id` or `type` reads as the builtin to
  # everyone except the author.
  "A",
  # Comprehension defects: list() around a comprehension, dict() around pairs.
  "C4",
  # Unused function arguments, which are usually a signature that drifted away
  # from its body.
  "ARG",
  # Ruff's own rules, including the ones that catch a broken noqa or an
  # unsorted __all__.
  "RUF",
  # Import sorting. This is the one entry that looks like a preference and is
  # not treated as one: the order is decided by the tool, not by a reviewer, and
  # `ruff check --fix` writes it. There is nothing here to argue about because
  # no human chooses the answer.
  "I",
]

[tool.ruff.lint.per-file-ignores]
# S101 is "assert used". A bare assert is pytest's whole idiom, and the rule
# exists for production code where asserts vanish under python -O. Tests do not
# run under -O.
"tests/**" = ["S101"]

[tool.ruff.format]
# The formatter runs in check mode in the gate and in write mode locally, and it
# is the same tool reading this same block in both. Nothing here departs from
# ruff's defaults, and that is the point: a formatter with local opinions is a
# formatter contributors fight.

# ---------------------------------------------------------------------------
# The type checker (mypy)
# ---------------------------------------------------------------------------

[tool.mypy]
# Strict from the first commit. Strictness is affordable on an empty tree and
# unaffordable on a full one, and a type checker in advisory mode accumulates
# errors until it can never be turned on. Decision record 0002 names dynamic
# typing as the cost of choosing Python and names this gate as the payment.
strict = true
python_version = "3.11"
mypy_path = "src"

# The scope the bare `mypy` command covers. It reads "the package" today and it
# has to read "the package and the tests" the moment a test exists, because a
# type checker that stops at the package leaves the half of the tree where the
# assertions live unchecked.
#
# `tests` is in this list as of issue #14, which is what created a directory for
# it to read. It was absent before that for a mechanical reason rather than a
# choice: mypy refuses a path that does not exist and refuses a directory
# holding no Python file, so naming it on an empty tree made the documented
# command exit 2. That is what #14 owed #15, and it is paid here.
#
# The linter and the formatter never had this problem. `[tool.ruff] src` and the
# per-file-ignores above already named tests, and ruff passes over a directory
# that is not there, so those two covered the tests the moment they arrived with
# no further edit.
files = ["src", "tests"]

# An import with no type information is an error rather than silence. This is
# what forces an untyped third-party dependency to be declared as a per-module
# relaxation with a comment, instead of quietly turning everything it touches
# into Any. It is mypy's default and it is written here so that turning it off
# has to be a visible edit.
ignore_missing_imports = false

# There are no per-module relaxations. When one is needed it goes here as its
# own [[tool.mypy.overrides]] block naming the untyped dependency that forces
# it and why, never as a blanket relaxation of the settings above.

# ---------------------------------------------------------------------------
# The test runner (pytest)
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
# The configuration is here and not in a pytest.ini, a tox.ini or a setup.cfg,
# because pytest reads the first of those it finds and stops. Two of them in one
# tree is a setting that appears to be on and is not, which is the failure this
# whole section exists to make impossible.

# The minimum version that understands everything below. Older pytest reading a
# key it does not know is the silent half of the same failure.
minversion = "8.0"

# Where the suite lives, so that the documented command needs no path argument
# and cannot be run against a different tree by accident.
testpaths = ["tests"]

# What a test file, class and function look like. Written down rather than
# inherited, because the default that discovers nothing is indistinguishable
# from a suite that passes.
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Strict mode, in the three places pytest offers one.
#
# --strict-markers turns an unregistered marker into an error. Without it a
# typo in @pytest.mark.integration silently marks nothing, and a selection
# expression built on that marker silently runs nothing.
#
# --strict-config turns an unknown key in this very block into an error, so a
# setting that does not exist cannot sit here looking like it is in force.
#
# -ra prints the reason for every non-passing outcome at the end of the run,
# including skips. A skip nobody sees is a test nobody runs.
addopts = ["--strict-markers", "--strict-config", "-ra"]

# Warnings are errors. A DeprecationWarning from a numeric library is how a
# reference signal changes shape between two runs of the same commit, and this
# project's fixtures are checksummed over exactly those bytes.
#
# This also promotes pytest's own return-not-None warning, which is the closest
# thing pytest has to catching a test that asserts nothing: a test that computes
# a value and returns it instead of asserting on it fails here rather than
# passing. It does not catch a test whose body simply contains no assertion at
# all; pytest has no mechanism for that and none is claimed here.
#
# A warning that has to be allowed is added below as its own `ignore::` line
# naming the library and the reason, never by removing "error".
filterwarnings = ["error"]

# An xfail that unexpectedly passes fails the run. Otherwise a fixed bug leaves
# its xfail in place forever and the suite reports a known failure that is not
# one any more.
xfail_strict = true

# The markers, and this list is the whole of what --strict-markers permits.
#
# The split is by directory first: tests/unit and tests/e2e. The markers exist
# so that a selection can be written without a path, which is what a workflow
# matrix and an editor's run button both want, and so that the split cannot be
# lost the day somebody moves a file.
#
# The split is here from the first day rather than retrofitted, because
# milestone 4 adds end-to-end runs through the fake adapter and retrofitting a
# split means editing every file that already exists.
markers = [
  "unit: fast, in-process, touches no subprocess and no file outside tmp_path",
  "e2e: end to end through a real entry point, allowed to be slow",
]
